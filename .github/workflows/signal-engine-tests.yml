name: Signal Engine Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  signal-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Compile critical modules
        run: |
          python -m compileall app worker tests ocr_token_alert_parser.py

      - name: Run unit tests
        env:
          DRY_RUN: "1"
        run: |
          pytest -q tests/test_signal_metrics.py tests/test_signal_learning_service.py tests/test_learning_route.py tests/test_state_service.py tests/test_db_service.py tests/test_tuning_service.py tests/test_candidate_gate_tuning.py

      - name: Run deterministic scan test
        env:
          DRY_RUN: "1"
        run: |
          python -m tests.scan_test

      - name: Run replay test (watch.log)
        env:
          DRY_RUN: "1"
        run: |
          python -m tests.scan_replay_test
