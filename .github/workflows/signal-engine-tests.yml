name: Signal Engine Tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  signal-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile critical modules
        run: |
          python -m compileall app worker tests ocr_token_alert_parser.py

      - name: Run unit tests
        env:
          DRY_RUN: "1"
        run: |
          python -m pytest -q

      - name: Run deterministic scan test
        env:
          DRY_RUN: "1"
        run: |
          python -m tests.scan_test

      - name: Run deterministic replay fixture
        env:
          DRY_RUN: "1"
        run: |
          python -m tests.scan_replay_test
